<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assistant</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%231e5eff%22/%3E%3Ctext x=%2216%22 y=%2223%22 font-family=%22sans-serif%22 font-size=%2220%22 font-weight=%22700%22 fill=%22white%22 text-anchor=%22middle%22%3En%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="embed">
  <div class="chat-head">
    <span class="bot-avatar"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5V6"/><circle cx="12" cy="2.6" r="1.1" fill="currentColor" stroke="none"/><rect x="4" y="6" width="16" height="12.5" rx="4"/><circle cx="9.2" cy="11.8" r="1.4" fill="currentColor" stroke="none"/><circle cx="14.8" cy="11.8" r="1.4" fill="currentColor" stroke="none"/><path d="M9.8 15.3h4.4M2 11v3.2M22 11v3.2"/></svg></span>
    <div class="chat-head-text"><b id="title">Assistant</b><small>Virtual assistant · here to help</small></div>
  </div>
  <div class="chat" style="height: calc(100% - 54px)">
    <div class="messages" id="messages" aria-live="polite"></div>
    <div class="suggestions" id="suggestions"></div>
    <form class="composer" id="composer">
      <label class="sr-only" for="message-input">Message</label>
      <textarea id="message-input" class="input" rows="1" placeholder="Loading…" disabled></textarea>
      <button class="btn btn-gradient" type="submit" id="send-btn" disabled>Send</button>
    </form>
  </div>
  <script src="config.js"></script>
  <script type="module" src="js/embed.js"></script>
</body>
</html>
